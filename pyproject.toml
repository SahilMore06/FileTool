[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "filetool"
version = "1.0.0"
description = "Native macOS offline desktop file conversion app and Finder drag wheel"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sahil More" }]
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6.0",
    "Pillow>=10.0.0",
    "pillow-heif>=0.14.0",
    "filetype>=1.2.0",
    "pypdf>=4.0.0",
    "pdf2docx>=0.5.8",
    "python-pptx>=0.6.22",
    "openpyxl>=3.1.2",
    "pandas>=2.1.0",
    "pyobjc-framework-Cocoa>=10.0.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.3.0",
]

[project.scripts]
filetool = "filetool.cli:main"
filetool-gui = "filetool.app:main"

[project.urls]
Homepage = "https://github.com/SahilMore06/FileTool"
Repository = "https://github.com/SahilMore06/FileTool"
Issues = "https://github.com/SahilMore06/FileTool/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["filetool*"]
