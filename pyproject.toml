[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxora"
version = "1.1.1"
description = "Fluxora – Intelligent File Conversion & Productivity Suite for macOS"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sahil More" }]
requires-python = ">=3.12"
keywords = [
    "macos",
    "file-converter",
    "batch-converter",
    "radial-menu",
    "offline-first",
    "pyside6",
    "ffmpeg",
    "cli",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: MacOS X :: Cocoa",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia",
    "Topic :: Utilities",
]
dependencies = [
    "PySide6>=6.6.0",
    "Pillow>=10.0.0",
    "pillow-heif>=0.14.0",
    "filetype>=1.2.0",
    "pypdf>=4.0.0",
    "pdf2docx>=0.5.8",
    "python-pptx>=0.6.22",
    "openpyxl>=3.1.2",
    "pandas>=2.1.0",
    "pyobjc-framework-Cocoa>=10.0.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.3.0",
]

[project.scripts]
fluxora = "filetool.cli:main"
fluxora-gui = "filetool.app:main"
filetool = "filetool.cli:main"
filetool-gui = "filetool.app:main"

[project.urls]
Homepage = "https://github.com/SahilMore06/Fluxora"
Repository = "https://github.com/SahilMore06/Fluxora"
Issues = "https://github.com/SahilMore06/Fluxora/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["filetool*"]
