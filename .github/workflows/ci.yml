name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Run Automated Tests
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install macOS CLI dependencies via Homebrew
        run: |
          brew install ffmpeg imagemagick pandoc poppler ghostscript sevenzip
          brew install --cask libreoffice
          ls -la /Applications/LibreOffice.app/Contents/MacOS/soffice

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run License Audit Gate
        run: |
          python scripts/audit_licenses.py --check

      - name: Run Pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest -v
