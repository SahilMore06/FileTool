name: Publish GitHub Package

on:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "filetool/**"
      - ".github/workflows/packages.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-container:
    name: Build & Push Fluxora CLI (ghcr.io)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Fluxora version
        id: ver
        run: |
          APP_VERSION="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' filetool/__init__.py | head -n 1)"
          echo "version=${APP_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/fluxora
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ steps.ver.outputs.version }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published GHCR package
        run: |
          IMAGE_LOWER="$(echo "ghcr.io/${{ github.repository_owner }}/fluxora:${{ steps.ver.outputs.version }}" | tr '[:upper:]' '[:lower:]')"
          docker pull "${IMAGE_LOWER}"
          WORK_DIR="$(mktemp -d)"
          docker run --rm -v "${WORK_DIR}:/work" --entrypoint python "${IMAGE_LOWER}" -c \
            "from PIL import Image; Image.new('RGB', (64, 64), '#F28A32').save('/work/sample.png')"
          docker run --rm -v "${WORK_DIR}:/work" "${IMAGE_LOWER}" sample.png --list-formats
          docker run --rm -v "${WORK_DIR}:/work" "${IMAGE_LOWER}" sample.png --to jpg --quality 90
          test -s "${WORK_DIR}/sample.jpg"
