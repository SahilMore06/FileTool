<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 440" width="1140" height="440" role="img" aria-labelledby="diagram-title-flow diagram-desc-flow" id="filetool_interaction_flow-root">
        <title id="diagram-title-flow">FileTool Radial Drag and Drop Interaction Flow</title>
        <desc id="diagram-desc-flow">Six-step chronological lifecycle from drag trigger to output delivery</desc>
        <defs>
      <style>
      #filetool_interaction_flow-root { --color-paper:        #f5f5f5;
      --color-paper-card:   #ffffff;
      --color-paper-subtle: #eae8e3;
      --color-ink:          #202124;
      --color-muted:        #4f5d75;
      --color-soft:         #6b778d;
      --color-rule:         rgba(45, 49, 66, 0.12);
      --color-rule-solid:   #bfc0c0;
      --color-accent:       #bf4520;
      --color-accent-brand: #f28a32;
      --color-accent-tint:  rgba(191, 69, 32, 0.08);
      --font-sans:          'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-serif:         'Instrument Serif', Georgia, serif;
      --font-mono:          'Geist Mono', ui-monospace, monospace; }
      #filetool_interaction_flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #filetool_interaction_flow-root .diagram-container { width: 100%;
      overflow-x: auto;
      background: var(--color-paper);
      border-radius: 12px;
      border: 1px solid var(--color-rule);
      padding: 1.5rem; }
      #filetool_interaction_flow-root .description { font-size: 0.95rem;
      color: var(--color-muted);
      line-height: 1.5;
      margin-bottom: 1.75rem;
      max-width: 860px; }
      @media print {
#filetool_interaction_flow-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="filetool_interaction_flow-flow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520" />
          </marker>
        </defs>

        <!-- Background Container -->
        <rect x="0" y="0" width="1140" height="440" rx="8" fill="#f5f5f5" />

        <!-- ─── STEP 1 ────────────────────────────── -->
        <g id="step-1">
          <rect x="25" y="45" width="165" height="340" rx="10" fill="#ffffff" stroke="#bfc0c0" stroke-width="1.2" />
          <rect x="25" y="45" width="165" height="34" rx="10" fill="#eae8e3" />
          <rect x="25" y="70" width="165" height="9" fill="#eae8e3" />
          <text x="37" y="67" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#bf4520">01 · DRAG</text>

          <text x="37" y="105" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#202124">Finder Drag</text>
          <text x="37" y="125" font-family="'Geist', sans-serif" font-size="11" fill="#4f5d75">User begins dragging</text>
          <text x="37" y="141" font-family="'Geist', sans-serif" font-size="11" fill="#4f5d75">one or more files in</text>
          <text x="37" y="157" font-family="'Geist', sans-serif" font-size="11" fill="#4f5d75">Finder or Desktop.</text>

          <rect x="37" y="180" width="141" height="60" rx="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="0.8" />
          <text x="47" y="202" font-family="'Geist Mono', monospace" font-size="10" fill="#6b778d">NSDragPboard</text>
          <text x="47" y="222" font-family="'Geist', sans-serif" font-size="11" fill="#202124">kUTTypeFileURL</text>

          <rect x="37" y="260" width="141" height="105" rx="6" fill="#eae8e3" />
          <text x="47" y="282" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#202124">Zero Permissions</text>
          <text x="47" y="300" font-family="'Geist', sans-serif" font-size="10" fill="#4f5d75">• No Accessibility</text>
          <text x="47" y="318" font-family="'Geist', sans-serif" font-size="10" fill="#4f5d75">• No Screen Record</text>
          <text x="47" y="336" font-family="'Geist', sans-serif" font-size="10" fill="#4f5d75">• Passive Quartz tap</text>
        </g>

        <!-- Arrow 1 -> 2 -->
        <line x1="190" y1="210" x2="215" y2="210" stroke="#bf4520" stroke-width="1.8" marker-end="url(#filetool_interaction_flow-flow-arrow)" />

        <!-- ─── STEP 2 ────────────────────────────── -->
        <g id="step-2">
          <rect x="215" y="45" width="165" height="340" rx="10" fill="#ffffff" stroke="#bfc0c0" stroke-width="1.2" />
          <rect x="215" y="45" width="165" height="34" rx="10" fill="#eae8e3" />
          <rect x="215" y="70" width="165" height="9" fill="#eae8e3" />
          <text x="227" y="67" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#bf4520">02 · TAP</text>

          <text x="227" y="105" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#202124">Modifier Tap</text>
          <text x="227" y="125" font-family="'Geist', sans-serif" font-size="11" fill="#4f5d75">During drag gesture,</text>
          <text x="227" y="141" font-family="'Geist', sans-serif" font-size="11" fill="#4f5d75">user taps modifier key:</text>
          <text x="227" y="159" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#bf4520">Shift · Cmd · Ctrl</text>

          <rect x="227" y="180" width="141" height="60" rx="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="0.8" />
          <text x="237" y="202" font-family="'Geist Mono', monospace" font-size="10" fill="#6b778d">Window Threshold</text>
          <text x="237" y="222" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#202124">&lt; 400ms duration</text>

          <rect x="227" y="260" width="141" height="105" rx="6" fill="#eae8e3" />
          <text x="237" y="282" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#202124">State Transitions</text>
          <text x="237" y="300" font-family="'Geist', sans-serif" font-size="10" fill="#4f5d75">• Press timestamp logged</text>
          <text x="237" y="318" font-family="'Geist', sans-serif" font-size="10" fill="#4f5d75">• Release confirmed</text>
          <text x="237" y="336" font-family="'Geist', sans-serif" font-size="10" fill="#bf4520">• Triggers wheel spawn</text>
        </g>

        <!-- Arrow 2 -> 3 -->
        <line x1="380" y1="210" x2="405" y2="210" stroke="#bf4520" stroke-width="1.8" marker-end="url(#filetool_interaction_flow-flow-arrow)" />

        <!-- ─── STEP 3 ────────────────────────────── -->
        <g id="step-3">
          <rect x="405" y="45" width="165" height="340" rx="10" fill="#bf4520" stroke="#bf4520" stroke-width="1.4" fill-opacity="0.04" />
          <rect x="405" y="45" width="165" height="34" rx="10" fill="#bf4520" />
          <rect x="405" y="70" width="165" height="9" fill="#bf4520" />
          <text x="417" y="67" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#ffffff">03 · SPAWN</text>

          <text x="417" y="105" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#bf4520">Radial Overlay</text>
          <text x="417" y="125" font-family="'Geist', sans-serif" font-size="11" fill="#4f5d75">Wheel springs open</text>
          <text x="417" y="141" font-family="'Geist', sans-serif" font-size="11" fill="#4f5d75">directly centered at</text>
          <text x="417" y="157" font-family="'Geist', sans-serif" font-size="11" fill="#4f5d75">current cursor (x, y).</text>

          <rect x="417" y="180" width="141" height="60" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8" />
          <text x="427" y="202" font-family="'Geist Mono', monospace" font-size="10" fill="#6b778d">Spring Physics</text>
          <text x="427" y="222" font-family="'Geist', sans-serif" font-size="11" fill="#202124">Scale 0.85 → 1.0 (200ms)</text>

          <rect x="417" y="260" width="141" height="105" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8" />
          <text x="427" y="282" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#202124">Contextual Petals</text>
          <text x="427" y="300" font-family="'Geist', sans-serif" font-size="10" fill="#4f5d75">• Image → JPG/PNG/WebP</text>
          <text x="427" y="318" font-family="'Geist', sans-serif" font-size="10" fill="#4f5d75">• Video → MP4/GIF/MOV</text>
          <text x="427" y="336" font-family="'Geist', sans-serif" font-size="10" fill="#4f5d75">• Doc → PDF/DOCX/MD</text>
        </g>

        <!-- Arrow 3 -> 4 -->
        <line x1="570" y1="210" x2="595" y2="210" stroke="#bf4520" stroke-width="1.8" marker-end="url(#filetool_interaction_flow-flow-arrow)" />

        <!-- ─── STEP 4 ────────────────────────────── -->
        <g id="step-4">
          <rect x="595" y="45" width="165" height="340" rx="10" fill="#ffffff" stroke="#bfc0c0" stroke-width="1.2" />
          <rect x="595" y="45" width="165" height="34" rx="10" fill="#eae8e3" />
          <rect x="595" y="70" width="165" height="9" fill="#eae8e3" />
          <text x="607" y="67" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#bf4520">04 · HOVER</text>

          <text x="607" y="105" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#202124">Sector Hover</text>
          <text x="607" y="125" font-family="'Geist', sans-serif" font-size="11" fill="#4f5d75">Cursor enters radial</text>
          <text x="607" y="141" font-family="'Geist', sans-serif" font-size="11" fill="#4f5d75">sector; polar angle</text>
          <text x="607" y="157" font-family="'Geist', sans-serif" font-size="11" fill="#4f5d75">atan2(dy, dx) tests hit.</text>

          <rect x="607" y="180" width="141" height="60" rx="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="0.8" />
          <text x="617" y="202" font-family="'Geist Mono', monospace" font-size="10" fill="#6b778d">Haptic &amp; Sound</text>
          <text x="617" y="222" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#202124">macOS tactile tick</text>

          <rect x="607" y="260" width="141" height="105" rx="6" fill="#eae8e3" />
          <text x="617" y="282" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#202124">Visual Feedback</text>
          <text x="617" y="300" font-family="'Geist', sans-serif" font-size="10" fill="#4f5d75">• Petal expands +10%</text>
          <text x="617" y="318" font-family="'Geist', sans-serif" font-size="10" fill="#bf4520">• Vibrant orange fill</text>
          <text x="617" y="336" font-family="'Geist', sans-serif" font-size="10" fill="#4f5d75">• Quality badge pops up</text>
        </g>

        <!-- Arrow 4 -> 5 -->
        <line x1="760" y1="210" x2="785" y2="210" stroke="#bf4520" stroke-width="1.8" marker-end="url(#filetool_interaction_flow-flow-arrow)" />

        <!-- ─── STEP 5 ────────────────────────────── -->
        <g id="step-5">
          <rect x="785" y="45" width="165" height="340" rx="10" fill="#ffffff" stroke="#bfc0c0" stroke-width="1.2" />
          <rect x="785" y="45" width="165" height="34" rx="10" fill="#eae8e3" />
          <rect x="785" y="70" width="165" height="9" fill="#eae8e3" />
          <text x="797" y="67" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#bf4520">05 · DROP</text>

          <text x="797" y="105" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#202124">File Drop Action</text>
          <text x="797" y="125" font-family="'Geist', sans-serif" font-size="11" fill="#4f5d75">User releases mouse</text>
          <text x="797" y="141" font-family="'Geist', sans-serif" font-size="11" fill="#4f5d75">button over desired</text>
          <text x="797" y="157" font-family="'Geist', sans-serif" font-size="11" fill="#4f5d75">format petal.</text>

          <rect x="797" y="180" width="141" height="60" rx="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="0.8" />
          <text x="807" y="202" font-family="'Geist Mono', monospace" font-size="10" fill="#6b778d">Collapse Animation</text>
          <text x="807" y="222" font-family="'Geist', sans-serif" font-size="11" fill="#202124">White flash + shrink</text>

          <rect x="797" y="260" width="141" height="105" rx="6" fill="#eae8e3" />
          <text x="807" y="282" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#202124">Hand-off to Engine</text>
          <text x="807" y="300" font-family="'Geist', sans-serif" font-size="10" fill="#4f5d75">• Dispatches ConversionJob</text>
          <text x="807" y="318" font-family="'Geist', sans-serif" font-size="10" fill="#4f5d75">• Hub shows progress %</text>
          <text x="807" y="336" font-family="'Geist', sans-serif" font-size="10" fill="#4f5d75">• UI thread unblocked</text>
        </g>

        <!-- Arrow 5 -> 6 -->
        <line x1="950" y1="210" x2="975" y2="210" stroke="#bf4520" stroke-width="1.8" marker-end="url(#filetool_interaction_flow-flow-arrow)" />

        <!-- ─── STEP 6 ────────────────────────────── -->
        <g id="step-6">
          <rect x="975" y="45" width="140" height="340" rx="10" fill="#ffffff" stroke="#27875b" stroke-width="1.4" />
          <rect x="975" y="45" width="140" height="34" rx="10" fill="#27875b" />
          <rect x="975" y="70" width="140" height="9" fill="#27875b" />
          <text x="987" y="67" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#ffffff">06 · FINISH</text>

          <text x="987" y="105" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#27875b">Safe Output</text>
          <text x="987" y="125" font-family="'Geist', sans-serif" font-size="11" fill="#4f5d75">Converted file</text>
          <text x="987" y="141" font-family="'Geist', sans-serif" font-size="11" fill="#4f5d75">is saved in the</text>
          <text x="987" y="157" font-family="'Geist', sans-serif" font-size="11" fill="#4f5d75">same folder.</text>

          <rect x="987" y="180" width="116" height="60" rx="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="0.8" />
          <text x="995" y="202" font-family="'Geist Mono', monospace" font-size="10" fill="#6b778d">Never Overwrite</text>
          <text x="995" y="222" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#27875b">name (1).ext</text>

          <rect x="987" y="260" width="116" height="105" rx="6" fill="#27875b" stroke="#27875b" stroke-width="0.8" fill-opacity="0.08" />
          <text x="995" y="282" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#27875b">Final Delivery</text>
          <text x="995" y="300" font-family="'Geist', sans-serif" font-size="10" fill="#202124">• Success chime</text>
          <text x="995" y="318" font-family="'Geist', sans-serif" font-size="10" fill="#202124">• macOS Notification</text>
          <text x="995" y="336" font-family="'Geist', sans-serif" font-size="10" fill="#27875b">• Reveal in Finder</text>
        </g>
      </svg>
