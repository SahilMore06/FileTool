<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" role="img" aria-labelledby="diagram-title-arch diagram-desc-arch" id="filetool_architecture-root">
        <title id="diagram-title-arch">Fluxora for macOS System Architecture</title>
        <desc id="diagram-desc-arch">Zero-accessibility Quartz event tap, contextual radial overlay, and async processing engine</desc>
        <defs>
      <style>
      #filetool_architecture-root { --color-paper:        #f5f5f5;
      --color-paper-card:   #ffffff;
      --color-paper-subtle: #eae8e3;
      --color-ink:          #202124;
      --color-ink-strong:   #111111;
      --color-muted:        #4f5d75;
      --color-soft:         #6b778d;
      --color-rule:         rgba(45, 49, 66, 0.12);
      --color-rule-solid:   #bfc0c0;
      --color-accent:       #bf4520;
      --color-accent-brand: #f28a32;
      --color-accent-tint:  rgba(191, 69, 32, 0.08);
      --font-sans:          'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-serif:         'Instrument Serif', Georgia, serif;
      --font-mono:          'Geist Mono', ui-monospace, monospace; }
      #filetool_architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #filetool_architecture-root .diagram-container { width: 100%;
      overflow-x: auto;
      background: var(--color-paper);
      border-radius: 12px;
      border: 1px solid var(--color-rule);
      padding: 1.5rem; }
      #filetool_architecture-root .description { font-size: 0.95rem;
      color: var(--color-muted);
      line-height: 1.5;
      margin-bottom: 1.75rem;
      max-width: 860px; }
      @media print {
#filetool_architecture-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="filetool_architecture-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4f5d75" />
          </marker>
          <marker id="filetool_architecture-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bf4520" />
          </marker>
        </defs>

        <!-- Background Container -->
        <rect x="0" y="0" width="1100" height="640" rx="8" fill="#f5f5f5" />

        <!-- ─── LAYER 1: macOS System & Quartz Tap ─────────────────── -->
        <g id="layer-quartz">
          <!-- Boundary Box -->
          <rect x="30" y="30" width="310" height="570" rx="10" fill="#ffffff" stroke="#bfc0c0" stroke-width="1.2" />
          <rect x="30" y="30" width="310" height="42" rx="10" fill="#eae8e3" />
          <rect x="30" y="62" width="310" height="10" fill="#eae8e3" />
          <text x="48" y="56" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#202124">1. macOS Event Source &amp; Trigger</text>
          <text x="48" y="94" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#bf4520">ZERO ACCESSIBILITY REQUIRED</text>

          <!-- Node 1A: Quartz Event Tap -->
          <rect x="48" y="112" width="274" height="88" rx="8" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1" />
          <text x="62" y="136" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#202124">Quartz CGEventSource</text>
          <text x="62" y="156" font-family="'Geist', sans-serif" font-size="11" fill="#4f5d75">Listens to kCGEventFlagsChanged</text>
          <text x="62" y="174" font-family="'Geist Mono', monospace" font-size="10" fill="#6b778d">Event Source: kCGAnnotatedSession</text>

          <!-- Node 1B: State Machine -->
          <rect x="48" y="230" width="274" height="110" rx="8" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1" />
          <text x="62" y="254" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#202124">Modifier Tap Detector</text>
          <text x="62" y="274" font-family="'Geist', sans-serif" font-size="11" fill="#4f5d75">Detects Shift / Cmd / Ctrl tap</text>
          <text x="62" y="294" font-family="'Geist', sans-serif" font-size="11" fill="#4f5d75">Threshold window: &lt; 400ms</text>
          <text x="62" y="316" font-family="ui-monospace, monospace" font-size="10" fill="#bf4520">mac_drag_monitor.py state machine</text>

          <!-- Node 1C: Drag State Validation -->
          <rect x="48" y="370" width="274" height="100" rx="8" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1" />
          <text x="62" y="394" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#202124">Active Drag Validator</text>
          <text x="62" y="414" font-family="'Geist', sans-serif" font-size="11" fill="#4f5d75">Reads NSDragPboard &amp; files</text>
          <text x="62" y="434" font-family="'Geist', sans-serif" font-size="11" fill="#4f5d75">Samples cursor (x, y) coordinates</text>
          <text x="62" y="454" font-family="'Geist Mono', monospace" font-size="10" fill="#6b778d">Clamps to active screen boundary</text>

          <!-- Status badge at bottom -->
          <rect x="48" y="500" width="274" height="76" rx="8" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08" />
          <text x="62" y="526" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#bf4520">Privacy-First Guarantee</text>
          <text x="62" y="546" font-family="'Geist', sans-serif" font-size="11" fill="#202124">No keylogging, no screen capture,</text>
          <text x="62" y="562" font-family="'Geist', sans-serif" font-size="11" fill="#202124">100% offline macOS Quartz loop.</text>

          <!-- Arrows inside Layer 1 -->
          <line x1="185" y1="200" x2="185" y2="230" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#filetool_architecture-arrow)" />
          <line x1="185" y1="340" x2="185" y2="370" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#filetool_architecture-arrow)" />
        </g>

        <!-- Connector L1 -> L2 -->
        <line x1="340" y1="285" x2="390" y2="285" stroke="#bf4520" stroke-width="1.8" marker-end="url(#filetool_architecture-arrow-accent)" />
        <rect x="345" y="268" width="40" height="16" fill="#f5f5f5" />
        <text x="348" y="280" font-family="'Geist Mono', monospace" font-size="9" fill="#bf4520">TRIGGER</text>

        <!-- ─── LAYER 2: Contextual Radial Wheel Overlay ────────────── -->
        <g id="layer-overlay">
          <!-- Boundary Box -->
          <rect x="390" y="30" width="320" height="570" rx="10" fill="#ffffff" stroke="#bfc0c0" stroke-width="1.2" />
          <rect x="390" y="30" width="320" height="42" rx="10" fill="#eae8e3" />
          <rect x="390" y="62" width="320" height="10" fill="#eae8e3" />
          <text x="408" y="56" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#202124">2. Radial Overlay &amp; Interaction</text>
          <text x="408" y="94" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#bf4520">PYSIDE6 TRANSPARENT OVERLAY</text>

          <!-- Node 2A: macOS Window Attributes -->
          <rect x="408" y="112" width="284" height="98" rx="8" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1" />
          <text x="422" y="136" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#202124">Non-Activating NSWindow</text>
          <text x="422" y="156" font-family="'Geist', sans-serif" font-size="11" fill="#4f5d75">NSWindowCollectionBehaviorCanJoinAllSpaces</text>
          <text x="422" y="174" font-family="'Geist', sans-serif" font-size="11" fill="#4f5d75">Stays above Finder without focus steal</text>
          <text x="422" y="194" font-family="'Geist Mono', monospace" font-size="10" fill="#6b778d">show_without_activating(self)</text>

          <!-- Node 2B: Petal Geometry & SF Symbols -->
          <rect x="408" y="235" width="284" height="135" rx="8" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.05" />
          <text x="422" y="259" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#bf4520">Radial Petal Engine</text>
          <text x="422" y="279" font-family="'Geist', sans-serif" font-size="11" fill="#202124">8 contextual curved sectors + center hub</text>
          <text x="422" y="297" font-family="'Geist', sans-serif" font-size="11" fill="#4f5d75">Native AppKit SF Symbol icon rasterizer</text>
          <text x="422" y="315" font-family="'Geist', sans-serif" font-size="11" fill="#4f5d75">Spring physics: OutBack / InOutQuad (60fps)</text>
          <text x="422" y="333" font-family="'Geist', sans-serif" font-size="11" fill="#4f5d75">Audio: Tink / Morse &amp; macOS Haptic tick</text>
          <text x="422" y="353" font-family="'Geist Mono', monospace" font-size="10" fill="#bf4520">wheel_painter.py · geometry.py</text>

          <!-- Node 2C: Hit Testing & Ring Feedback -->
          <rect x="408" y="395" width="284" height="110" rx="8" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1" />
          <text x="422" y="419" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#202124">Sector Angle Hit-Testing</text>
          <text x="422" y="439" font-family="'Geist', sans-serif" font-size="11" fill="#4f5d75">atan2(dy, dx) polar angle classification</text>
          <text x="422" y="457" font-family="'Geist', sans-serif" font-size="11" fill="#4f5d75">Drop target confirmation + white ripple flash</text>
          <text x="422" y="475" font-family="'Geist Mono', monospace" font-size="10" fill="#6b778d">Primary &amp; secondary ring output petals</text>

          <!-- Node 2D: Wheel Switching -->
          <rect x="408" y="525" width="284" height="52" rx="6" fill="#eae8e3" />
          <text x="422" y="546" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#202124">Three Wheel Modes: Convert · Tools · Actions</text>
          <text x="422" y="563" font-family="'Geist Mono', monospace" font-size="10" fill="#4f5d75">Switch crossfade &amp; smooth rotation arc</text>

          <!-- Arrows inside Layer 2 -->
          <line x1="550" y1="210" x2="550" y2="235" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#filetool_architecture-arrow)" />
          <line x1="550" y1="370" x2="550" y2="395" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#filetool_architecture-arrow)" />
        </g>

        <!-- Connector L2 -> L3 -->
        <line x1="710" y1="450" x2="760" y2="450" stroke="#bf4520" stroke-width="1.8" marker-end="url(#filetool_architecture-arrow-accent)" />
        <rect x="715" y="433" width="40" height="16" fill="#f5f5f5" />
        <text x="722" y="445" font-family="'Geist Mono', monospace" font-size="9" fill="#bf4520">DROP</text>

        <!-- ─── LAYER 3: Core Engine & Output Handlers ──────────────── -->
        <g id="layer-execution">
          <!-- Boundary Box -->
          <rect x="760" y="30" width="310" height="570" rx="10" fill="#ffffff" stroke="#bfc0c0" stroke-width="1.2" />
          <rect x="760" y="30" width="310" height="42" rx="10" fill="#eae8e3" />
          <rect x="760" y="62" width="310" height="10" fill="#eae8e3" />
          <text x="778" y="56" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#202124">3. Local Execution &amp; Output</text>
          <text x="778" y="94" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#bf4520">ASYNC QTHREADPOOL ENGINE</text>

          <!-- Node 3A: Job Runner & Registry -->
          <rect x="778" y="112" width="274" height="98" rx="8" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1" />
          <text x="792" y="136" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#202124">JobRunner &amp; Registry</text>
          <text x="792" y="156" font-family="'Geist', sans-serif" font-size="11" fill="#4f5d75">MIME &amp; extension auto-dispatch</text>
          <text x="792" y="174" font-family="'Geist', sans-serif" font-size="11" fill="#4f5d75">Worker threads: non-blocking UI queue</text>
          <text x="792" y="194" font-family="'Geist Mono', monospace" font-size="10" fill="#6b778d">runner.py · registry.py</text>

          <!-- Node 3B: Modular Conversion Adapters -->
          <rect x="778" y="230" width="274" height="150" rx="8" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1" />
          <text x="792" y="254" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#202124">Modular Adapters</text>
          <text x="792" y="274" font-family="'Geist', sans-serif" font-size="11" fill="#4f5d75">• ImageOps: Pillow / WebP / AVIF / HEIC</text>
          <text x="792" y="292" font-family="'Geist', sans-serif" font-size="11" fill="#4f5d75">• Video &amp; Audio: FFmpeg / libx264 / AAC</text>
          <text x="792" y="310" font-family="'Geist', sans-serif" font-size="11" fill="#4f5d75">• Office / Docs: Pandoc / LibreOffice</text>
          <text x="792" y="328" font-family="'Geist', sans-serif" font-size="11" fill="#4f5d75">• Tools: Metadata strip, Resize, Crop</text>
          <text x="792" y="348" font-family="'Geist', sans-serif" font-size="11" fill="#4f5d75">• Actions: AirDrop, Copy, Move, Terminal</text>
          <text x="792" y="368" font-family="'Geist Mono', monospace" font-size="10" fill="#6b778d">core/image_ops.py · media.py</text>

          <!-- Node 3C: Output Safety & Collision -->
          <rect x="778" y="400" width="274" height="88" rx="8" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1" />
          <text x="792" y="424" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#202124">Safe Output Collision Resolver</text>
          <text x="792" y="444" font-family="'Geist', sans-serif" font-size="11" fill="#4f5d75">Appends filename (1).ext automatically</text>
          <text x="792" y="462" font-family="'Geist', sans-serif" font-size="11" fill="#4f5d75">Original files are never overwritten</text>
          <text x="792" y="480" font-family="'Geist Mono', monospace" font-size="10" fill="#6b778d">utils.get_unique_output_path()</text>

          <!-- Node 3D: Completion & Feedback -->
          <rect x="778" y="505" width="274" height="72" rx="8" fill="#27875b" stroke="#27875b" stroke-width="1" fill-opacity="0.08" />
          <text x="792" y="528" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#27875b">Completion &amp; Notification</text>
          <text x="792" y="546" font-family="'Geist', sans-serif" font-size="11" fill="#202124">Native macOS notification + Hero chime</text>
          <text x="792" y="562" font-family="'Geist Mono', monospace" font-size="10" fill="#27875b">NSWorkspace.reveal_in_finder()</text>

          <!-- Arrows inside Layer 3 -->
          <line x1="915" y1="210" x2="915" y2="230" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#filetool_architecture-arrow)" />
          <line x1="915" y1="380" x2="915" y2="400" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#filetool_architecture-arrow)" />
        </g>
      </svg>
